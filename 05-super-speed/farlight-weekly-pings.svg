<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="proj" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <rect width="3" height="6" fill="#bfe3d2"/>
    </pattern>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#1b2430">Farlight's pings fell from about 12 a week to none after 4.2. The aim for 4.3 is to bring them back.</text>
  <text x="30" y="50" font-size="12" fill="#5a6675">Pings per week. Actuals: 29 Jun to 6 Sep 2026 (pings table). Hatched bars after 4.3 are a proposed target, not a forecast.</text>

  <!-- gridlines -->
  <g stroke="#e3e8ee" stroke-width="1">
    <line x1="60" y1="290" x2="940" y2="290"/>
    <line x1="60" y1="230" x2="940" y2="230"/>
    <line x1="60" y1="170" x2="940" y2="170"/>
    <line x1="60" y1="110" x2="940" y2="110"/>
  </g>
  <g font-size="11" fill="#5a6675" text-anchor="end">
    <text x="52" y="294">0</text><text x="52" y="234">5</text><text x="52" y="174">10</text><text x="52" y="114">15</text>
  </g>

  <!-- 4.2 marker -->
  <line x1="461" y1="80" x2="461" y2="290" stroke="#1b2430" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="467" y="92" font-size="12" font-weight="600" fill="#1b2430">4.2 ships, 12 Aug</text>

  <!-- actual bars: 12 px per ping, baseline y=290, width 52, spacing 63 -->
  <g>
    <rect x="68"  y="146" width="52" height="144" fill="#3b6fd4"/>
    <rect x="131" y="146" width="52" height="144" fill="#3b6fd4"/>
    <rect x="194" y="158" width="52" height="132" fill="#3b6fd4"/>
    <rect x="257" y="146" width="52" height="144" fill="#3b6fd4"/>
    <rect x="320" y="134" width="52" height="156" fill="#3b6fd4"/>
    <rect x="383" y="146" width="52" height="144" fill="#3b6fd4"/>
    <rect x="446" y="170" width="52" height="120" fill="#d97a1f"/>
    <rect x="509" y="254" width="52" height="36"  fill="#d97a1f"/>
    <rect x="572" y="278" width="52" height="12"  fill="#d97a1f"/>
    <rect x="635" y="288" width="52" height="2"   fill="#d97a1f"/>
  </g>
  <g font-size="12" font-weight="600" fill="#1b2430" text-anchor="middle">
    <text x="94"  y="140">12</text><text x="157" y="140">12</text><text x="220" y="152">11</text>
    <text x="283" y="140">12</text><text x="346" y="128">13</text><text x="409" y="140">12</text>
    <text x="472" y="164">10</text><text x="535" y="248">3</text><text x="598" y="272">1</text><text x="661" y="282">0</text>
  </g>
  <g font-size="11" fill="#5a6675" text-anchor="middle">
    <text x="94" y="308">29 Jun</text><text x="157" y="308">6 Jul</text><text x="220" y="308">13 Jul</text>
    <text x="283" y="308">20 Jul</text><text x="346" y="308">27 Jul</text><text x="409" y="308">3 Aug</text>
    <text x="472" y="308">10 Aug</text><text x="535" y="308">17 Aug</text><text x="598" y="308">24 Aug</text><text x="661" y="308">31 Aug</text>
  </g>

  <!-- data gap -->
  <line x1="707" y1="130" x2="707" y2="290" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="712" y="150" font-size="11" fill="#5a6675">Data ends 6 Sep.</text>
  <text x="712" y="164" font-size="11" fill="#5a6675">Weeks after are</text>
  <text x="712" y="178" font-size="11" fill="#5a6675">unknown.</text>

  <!-- 4.3 marker -->
  <line x1="800" y1="80" x2="800" y2="290" stroke="#1b2430" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="806" y="92" font-size="12" font-weight="600" fill="#1b2430">4.3 ships (date TBC)</text>

  <!-- projected bars: gradual return to about 12 -->
  <g stroke="#2f8f68" stroke-width="1.5" stroke-dasharray="4 3" fill="url(#proj)">
    <rect x="810" y="242" width="28" height="48"/>
    <rect x="845" y="194" width="28" height="96"/>
    <rect x="880" y="146" width="28" height="144"/>
  </g>
  <g font-size="12" font-weight="600" fill="#2f8f68" text-anchor="middle">
    <text x="824" y="236">4</text><text x="859" y="188">8</text><text x="894" y="140">12</text>
  </g>
  <g font-size="11" fill="#5a6675" text-anchor="middle">
    <text x="824" y="308">wk 1</text><text x="859" y="308">wk 2</text><text x="894" y="308">wk 3</text>
  </g>
  <text x="858" y="326" font-size="11" fill="#2f8f68" text-anchor="middle">Target: gradual return to about 12</text>

  <!-- legend -->
  <rect x="60" y="346" width="10" height="10" fill="#3b6fd4"/><text x="76" y="355" font-size="11" fill="#5a6675">Before 4.2: about 73% taken</text>
  <rect x="240" y="346" width="10" height="10" fill="#d97a1f"/><text x="256" y="355" font-size="11" fill="#5a6675">From 12 Aug: 2 of 11 pings taken, 7 missed</text>
  <rect x="520" y="346" width="10" height="10" fill="url(#proj)" stroke="#2f8f68" stroke-dasharray="2 2"/><text x="536" y="355" font-size="11" fill="#5a6675">Proposed target, not a forecast</text>
  <text x="940" y="355" font-size="11" fill="#5a6675" text-anchor="end">Week of 10 Aug includes 3 pings before 12 Aug</text>
</svg>
